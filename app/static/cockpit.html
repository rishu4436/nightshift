<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Nightshift · Judge cockpit</title>
  <style>
    body { margin:0; background:#08090c; color:#f3efe6; font:15px/1.45 system-ui,sans-serif; }
    main { max-width:820px; margin:0 auto; padding:32px 18px 80px; }
    a { color:#3ee6b6; }
    table { width:100%; border-collapse:collapse; margin:16px 0; }
    td, th { border-bottom:1px solid #222; padding:8px 6px; text-align:left; font-size:13px; }
    .proven { color:#3ee6b6; }
    .no { color:#ff5d73; }
    button { background:#f3efe6; color:#111; border:0; padding:10px 14px; border-radius:999px; cursor:pointer; font-weight:600; }
    pre { background:#101218; padding:12px; overflow:auto; font-size:12px; border-radius:12px; }
  </style>
</head>
<body>
<main>
  <p><a href="/">← Desk</a> · <a href="/share">Share report</a></p>
  <h1>Judge cockpit</h1>
  <p>Poke the kernel. It writes a receipt. It does <b>not</b> place a Bitget order.</p>
  <table id="claims"></table>
  <p>
    <button id="poke">Evaluate frozen_illusion</button>
    <button id="quiet">Evaluate quiet_hold</button>
  </p>
  <pre id="out">Click evaluate.</pre>
</main>
<script>
async function claims() {
  const d = await (await fetch("/api/claims")).json();
  document.getElementById("claims").innerHTML = "<tr><th>Claim</th><th>Status</th></tr>" +
    d.claims.map(c => `<tr><td>${c.claim}</td><td class="${c.status==="proven"?"proven":"no"}">${c.status}</td></tr>`).join("");
}
async function poke(scenario) {
  const d = await (await fetch("/api/evaluate", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({scenario})
  })).json();
  document.getElementById("out").textContent = JSON.stringify(d, null, 2);
  claims();
}
document.getElementById("poke").onclick = () => poke("frozen_illusion");
document.getElementById("quiet").onclick = () => poke("quiet_hold");
claims();
</script>
</body>
</html>
