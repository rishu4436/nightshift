[project]
name = "nightshift"
version = "0.1.0"
description = "UTA weekend risk kernel: Monday-implied margin for Bitget rToken collateral"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "httpx>=0.27.0",
  "pydantic>=2.9.0",
  "python-dotenv>=1.0.1",
  "tzdata>=2025.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
